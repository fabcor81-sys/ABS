name: Android UX / Navigation checks

on:
  pull_request:
  push:
    branches:
      - fix/post-pulse-pump-recovery-5s

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK on hosted runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: chmod +x ./gradlew
      - name: Compile APK and instrumentation test sources; run unit tests
        run: ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest --stacktrace
